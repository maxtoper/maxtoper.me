
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{- if .IsHome -}}
       {{ .Site.Title }}
      {{- else -}}
       {{ .Site.Title }} | {{ .Title }} 
      {{- end -}} 
</title>

<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with site.Params.description }}{{ . }}{{ end }}{{ end }}">
<meta name="author" content="{{ with site.Params.author }}{{ . }}{{ end }}">
<meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'self';
        script-src 'self';
        style-src 'self';
        img-src 'self' data: https:;
        font-src 'self' data:;
        connect-src 'self';
        frame-src https://www.youtube.com https://www.youtube-nocookie.com;
        upgrade-insecure-requests;
      ">


<link rel="icon" type="image/x-icon" href="{{ "images/icons/favicon.ico" | relURL }}"> 
<link rel="icon" type="image/png" sizes="16x16" href="{{ "images/icons/favicon-16x16.png" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "images/icons/favicon-32x32.png" | relURL }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ "images/icons/apple-touch-icon.png" | relURL }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ "images/icons/android-chrome-192x192.png" | relURL }}">
<link rel="icon" type="image/png" sizes="512x512" href="{{ "images/icons/android-chrome-512x512.png" | relURL }}">   
<link rel="manifest" href="{{ "images/icons/site.webmanifest" | relURL }}">
<link rel="canonical" href="{{ .Permalink }}">


<meta property="og:type" content='{{ if and .IsPage (eq .Section "blog") }}article{{ else }}website{{ end }}'>
<meta property="og:title" content="{{ .Title | default site.Title }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:image" content="{{ "images/social-preview.png" | absURL }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title | default site.Title }}">
<meta name="twitter:description" content="{{ .Description | default site.Params.description }}">
<meta name="twitter:image" content="{{ "images/social-preview.png" | absURL }}">



{{ $pico := resources.Get "css/pico.purple.css" | minify | fingerprint }}
{{ $custom := resources.Get "css/custom.css" }}

{{ $styles := slice $pico $custom | resources.Concat "css/style.css" | minify | fingerprint }}

<link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | absURL }}">
